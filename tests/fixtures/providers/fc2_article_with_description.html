<!DOCTYPE html>
<html lang="ja"><head>
<!-- Constructed sample mirroring the real FC2 article page structure.
     Derived from a live page captured through the Japan proxy on 2026-11-15:
     the article page itself only carries a *truncated* og:description (~70 chars)
     and embeds the real description in an iframe widget. All text below is
     invented; the structure is what the adapter depends on. -->
<meta charset="utf-8">
<title>FC2-PPV-1234567 サンプル作品 | FC2コンテンツマーケット</title>
<meta name="description" content="FC2-PPV-1234567 サンプル作品の説明 その二 その三">
<meta property="og:title" content="FC2-1234567 サンプル作品タイトル">
<meta property="og:description" content="FC2-PPV-1234567 サンプル作品の説明 その二…">
<meta property="og:image" content="https://storage201000.contents.fc2.com/file/cover.jpg">
</head><body>
<h1>コンテンツマーケット</h1>
<section class="items_article_MainitemThumb">
  <img src="//contents-thumbnail2.fc2.com/w276/storage201000.contents.fc2.com/file/cover.jpg">
</section>
<section class="items_article_SampleImagesArea">
  <a href="/sample/1.jpg"><img src="//contents-thumbnail2.fc2.com/w480/sample1.jpg"></a>
</section>
<section class="items_article_Contents" data-readmore="5000">
  <h3>商品説明</h3>
  <iframe src="/widget/article/1234567/description?ac=deadbeefdeadbeefdeadbeefdeadbeef"
          frameborder="0" data-iframe="description"></iframe>
</section>
</body></html>
