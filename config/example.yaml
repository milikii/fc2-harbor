# fc2-harbor configuration template.
#
# Copy to `config/config.yaml` (git-ignored) and adjust. Every ${ENV_VAR}
# placeholder is expanded from the process environment / `.env` at startup.
# Secrets must only ever live in `.env` or Docker secrets, never in this file.

app:
  timezone: Asia/Shanghai
  database_url: sqlite+aiosqlite:////app/data/app.db
  log_level: INFO
  log_json: true
  # Rotating log file on the data volume so logs are persisted and backed up.
  log_file: /app/data/logs/app.log
  # Internal health/status endpoint, bound inside the container network only.
  health_host: 0.0.0.0
  health_port: 8080

subscription:
  # false = only the manual bot runs; Nyaa polling is not started at all.
  polling_enabled: true
  # Cards published per round; a backlog drains gradually instead of flooding.
  max_push_per_round: 10

fc2:
  # Digit width used to recognise an FC2 PPV number (spec 6.3 lists formats but
  # not the width). Anything outside the range is not treated as a content id.
  code_min_digits: 5
  code_max_digits: 8

telegram:
  # Subscription bot is delivered in M4; leave empty until then.
  subscription_bot_token: "${SUBSCRIPTION_BOT_TOKEN}"
  manual_bot_token: "${MANUAL_BOT_TOKEN}"
  allowed_user_ids: "${TELEGRAM_ALLOWED_USER_IDS}"
  proxy: direct

nyaa:
  base_url: https://sukebei.nyaa.si
  query: FC2
  scope: site
  poll_interval_seconds: 180
  initial_lookback_hours: 24
  # First start backfills this window. Those contents are marked as backfilled and
  # never pushed as cards; only content found after the first round is delivered.
  initial_backfill_silent: true
  proxy: direct
  # RSS first; the search page is the catch-up path when one round overflows
  # the RSS window. Neither path may carry an uploader filter (spec 6.1).
  rss_path: /?page=rss&q=FC2&c=0_0&f=0
  search_path: /?f=0&c=0_0&q=FC2&p={page}
  rss_page_size: 75
  search_max_pages: 5
  # Item ids remembered for the overlap re-check (ids, not pubDate).
  overlap_item_ids: 200
  # Trackers appended to magnets built from the RSS info hash.
  trackers: []
  user_agent: fc2-harbor/0.1 (+https://github.com/milikii/fc2-harbor)
  timeout_seconds: 20
  retries: 2
  concurrency: 2
  max_retry_after_seconds: 60

provider:
  # Spec 7.1 expects all nine providers enabled. Strict mode fails startup when
  # one is disabled; set this to false only to switch a broken source off
  # temporarily — that is logged and audited at startup.
  strict_enabled: true
  # Keep querying lower-priority providers while the description is only a
  # summary, hoping for real body text. Costs one request per remaining provider
  # per card; measurement found no free source with a full FC2 description, so
  # this stays off. The merge rule (full beats summary) always applies.
  seek_full_description: false
  # Fixed order, never reordered by hit rate (spec 7.1). Validated at startup.
  priorities:
    jav_fc2: [Fc2, fc2_hub, Javdb, Mmtv, freejavbt, miss_av, Javlibrary, avsox, Madou]
  # Every source gets a Chrome-like header set automatically. The optional keys:
  #   warmup_url            visit this page once first: collects cookies and makes
  #                         the Referer same-origin (what a browser does)
  #   min_interval_seconds  minimum gap between requests (10 = 6/min)
  #   jitter_seconds        random extra delay, avoids a metronome pattern
  #   headers               per-site header overrides
  # Sites behind a Cloudflare JS challenge (javten, missav, javlibrary) still answer
  # 403 `cf-mitigated: challenge`; headers/cookies cannot solve that, it needs a
  # browser or a challenge-solving proxy.
  sources:
    Fc2: {host: adult.contents.fc2.com, enabled: true, proxy: japan}
    fc2_hub:
      host: javten.com
      enabled: true
      proxy: japan
      warmup_url: "https://javten.com/"
      min_interval_seconds: 10
      jitter_seconds: 2
    Javdb: {host: javdb.com, enabled: true, proxy: japan}
    Mmtv: {host: 7mmtv.sx, enabled: true, proxy: japan}
    freejavbt: {host: freejavbt.com, enabled: true, proxy: japan}
    miss_av:
      host: missav123.com
      enabled: true
      proxy: japan
      warmup_url: "https://missav123.com/"
      min_interval_seconds: 10
      jitter_seconds: 2
    Javlibrary:
      host: javlibrary.com
      enabled: true
      proxy: japan
      warmup_url: "https://www.javlibrary.com/en/"
      min_interval_seconds: 10
      jitter_seconds: 2
    avsox:
      host: avsox.click
      enabled: true
      proxy: japan
      warmup_url: "https://avsox.click/"
      min_interval_seconds: 10
      jitter_seconds: 2
    Madou: {host: madou.club, enabled: true, proxy: japan}
  # Sites added through configuration only — no code change needed. They run after
  # the fixed nine and go through the same browser headers, cookie warm-up and
  # pacing. Uncomment and fill in once a site is verified:
  # custom:
  #   - name: some_site
  #     enabled: true
  #     search_url: "https://x.com/search?q={code}"
  #     detail_url: "https://x.com/v/{id}"     # optional; omit to parse the search page
  #     proxy: japan
  #     warmup_url: "https://x.com/"
  #     min_interval_seconds: 10
  #     selectors:
  #       card: ".item"
  #       title: ".title"
  #       link: "a[href]"
  #       cover: "img[data-src]"
  #       description: ".desc"                # optional
  #       previews: ".gallery img"            # optional

proxy_profiles:
  direct: {type: direct}
  japan: {type: socks5h, url: "${JP_PROXY_URL}", region: JP}
  japan_backup: {type: http, url: "${JP_BACKUP_PROXY_URL}", region: JP}

image_fetch:
  # Default: fetch any host whose resolved address is public. The SSRF guard (public
  # IP only, re-checked on every redirect hop) is the real boundary — Nyaa posts link
  # images on third-party hosts (imagetwist, kr-av, …) that a host list cannot cover.
  # Set true to also enforce `allowed_hosts` (locked-down installs).
  strict_allowlist: false
  default_proxy: inherit_provider
  # Content-addressed image cache, on local disk (spec 19).
  cache_dir: /app/data/cache/images
  max_bytes: 20971520
  max_previews: 9
  min_preview_images: 3
  cdn_routes: {}
  # Domain allowlist for image/page downloads (spec 20). Empty means "derive from
  # the registered domain of every configured provider" (fc2.com, javdb.com, …).
  # Set explicit hosts to be stricter; subdomains are included automatically.
  allowed_hosts: []
  # allowed_hosts:
  #   - fc2.com
  #   - jdbstatic.com
  #   - javten.com
  #   - 7mmtv.sx
  #   - freejavbt.com
  #   - missav123.com
  #   - javlibrary.com
  #   - avsox.click
  #   - madou.club
  #   - nyaa.si

translation:
  # google_free: key-less Google endpoint (clients5.google.com/translate_a/t).
  # It must go through a proxy profile; direct connections time out from here.
  # A blocked or broken endpoint only leaves description_zh empty — the card is
  # still sent with the Japanese text.
  # Switch to openai_compatible to use a chat-completions endpoint instead; that
  # one requires base_url + api_key + model and fails fast when enabled without them.
  enabled: true
  provider: google_free
  # When Google rate-limits this exit IP (429 / challenge page), fall back to the
  # free MyMemory API instead of shipping a card without Chinese text.
  fallback_provider: mymemory
  proxy: japan
  target_language: zh-CN
  source_language: ja
  # openai_compatible only (placeholders — leave unset for google_free):
  base_url: "${TRANSLATION_BASE_URL}"
  api_key: "${TRANSLATION_API_KEY}"
  model: "${TRANSLATION_MODEL}"

publisher:
  # A card without a cover is not pushed: the publisher retries the metadata fetch
  # on later rounds instead of sending a degraded card.
  require_cover: true
  # Rounds allowed to obtain a cover before the content is marked give_up (never
  # pushed, no further attempts).
  cover_retry_limit: 3

download:
  default_downloader: qbittorrent
  # Startup reconciliation stops resubmitting a job after this many attempts.
  max_retries: 5
  routes:
    fc2: qbittorrent
    jav: qbittorrent
    cn: qbittorrent
    western: qbittorrent
    review: qbittorrent

downloaders:
  qbittorrent:
    enabled: true
    url: "${QBITTORRENT_URL}"
    username: "${QBITTORRENT_USERNAME}"
    password: "${QBITTORRENT_PASSWORD}"
    # Remote path seen by qBittorrent. The app writes to a per-job subdirectory.
    save_path_template: /downloads/{category}/{job_id}
    category: fc2-harbor
    timeout_seconds: 15
    poll_interval_seconds: 30
    # Two consecutive identical observations, 10s apart (spec 14.2).
    stability_checks: 2
    stability_interval_seconds: 10
    max_stability_wait_seconds: 600
  transmission:
    enabled: false
    url: "${TRANSMISSION_URL}"
    username: "${TRANSMISSION_USERNAME}"
    password: "${TRANSMISSION_PASSWORD}"
    save_path_template: /downloads/{category}/{job_id}

storage:
  # Explicit mapping only. Unmapped paths are an error, never string-patched.
  path_mappings:
    - remote: /downloads
      local: /downloads
  final_roots:
    fc2: /library/fc2
    jav: /library/jav
    cn: /library/cn
    western: /library/western
    review: /library/_review
  dir_name_max_length: 120
  verify_sha256_on_copy: false
  fsync_on_copy: true
  copy_chunk_bytes: 4194304
