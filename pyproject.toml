[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fc2-harbor"
version = "0.1.0"
description = "FC2 / Nyaa BT automation: subscribe, notify, download, organize"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

dependencies = [
    "aiogram>=3.13,<4",
    "httpx[socks]>=0.27,<1",
    "selectolax>=0.3.21",
    "defusedxml>=0.7.1",
    "sqlalchemy>=2.0.30,<2.1",
    "aiosqlite>=0.20",
    "alembic>=1.13,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0.1",
    "pillow>=10.4",
    "tenacity>=9.0",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live: manual live smoke tests that hit real websites; never run in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "ASYNC", "S", "RUF",
]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", # ambiguous unicode in strings (Japanese titles are expected)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["aiogram.*", "selectolax.*", "defusedxml.*"]
ignore_missing_imports = true
